name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest
        working-directory: helper
      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name fiora_guide --paths helper `
            --add-data "index.html;." --add-data "editor.html;." `
            --add-data "app.js;." --add-data "styles.css;." `
            helper/fiora_guide.py
      - name: Package
        run: |
          mkdir release
          Copy-Item dist/fiora_guide.exe release/
          Copy-Item -Recurse data release/data
          Compress-Archive -Path release/* -DestinationPath fiora-counter-guide.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fiora-counter-guide
          path: fiora-counter-guide.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fiora-counter-guide.zip
